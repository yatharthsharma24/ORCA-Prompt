[project]
name = "orca-prompt"
version = "0.1.0"
description = "ORCA-Prompt: a multi-agent ReAct assistant for marine ecosystem reasoning, running on a local LLM via Ollama."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
orca = "orca.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orca*"]

[tool.setuptools.package-data]
orca = ["web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "S"]
ignore = [
    "B008",  # FastAPI Depends()/Header() defaults
    "S101",  # assert in tests
    "S608",  # SQL is built from catalog-validated identifiers; values are bound parameters
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
